  <text x="40" y="194" font-size="16" fill="#D9C9F5">for students who want to build their future.</text>
  <rect x="40" y="214" width="268" height="32" rx="16" fill="#5B2BB0"/>
  <text x="174" y="235" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Saturday, 10am at the Main Auditorium</text>
