<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="heroClip"><rect x="0" y="56" width="800" height="250"/></clipPath>
  </defs>
  <rect width="800" height="500" fill="#EEF2FB"/>

  <!-- nav -->
  <rect width="800" height="56" fill="#FFFFFF"/>
  <text x="32" y="35" font-size="20" font-weight="700" fill="#1F3A8A">Hope Youth Fellowship</text>
  <text x="470" y="34" font-size="14" fill="#44506B">Events</text>
  <text x="540" y="34" font-size="14" fill="#44506B">About</text>
  <text x="604" y="34" font-size="14" fill="#44506B">Contact</text>
  <rect x="684" y="13" width="84" height="30" rx="15" fill="#1F3A8A"/>
  <text x="726" y="33" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Join us</text>

  <!-- hero -->
  <rect x="0" y="56" width="800" height="250" fill="#1F3A8A"/>
  <text x="40" y="136" font-size="36" font-weight="800" fill="#FFFFFF">Meetings, events and</text>
  <text x="40" y="178" font-size="36" font-weight="800" fill="#FFFFFF">ways to get involved.</text>
  <text x="40" y="212" font-size="15" fill="#C7D3F3">Everyone is welcome. Come as you are</text>
  <text x="40" y="233" font-size="15" fill="#C7D3F3">and meet people who will encourage you.</text>
  <rect x="40" y="252" width="132" height="42" rx="21" fill="#FFFFFF"/>
  <text x="106" y="278" font-size="15" font-weight="700" fill="#1F3A8A" text-anchor="middle">Join us</text>
  <rect x="185" y="253" width="140" height="40" rx="20" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="255" y="278" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">See events</text>

  <!-- group of people -->
  <g clip-path="url(#heroClip)">
    <circle cx="640" cy="130" r="150" fill="#2B4DB0" opacity="0.55"/>
    <!-- person 1 -->
    <circle cx="520" cy="196" r="24" fill="#8D5524"/>
    <path d="M484 310 L484 262 Q484 232 520 232 Q556 232 556 262 L556 310 Z" fill="#FFC20E"/>
    <!-- person 2 -->
    <circle cx="595" cy="178" r="26" fill="#C68642"/>
    <path d="M556 310 L556 246 Q556 212 595 212 Q634 212 634 246 L634 310 Z" fill="#F97316"/>
    <!-- person 3 -->
    <circle cx="672" cy="186" r="25" fill="#5C3A21"/>
    <path d="M634 310 L634 254 Q634 222 672 222 Q710 222 710 254 L710 310 Z" fill="#34D399"/>
    <!-- person 4 -->
    <circle cx="745" cy="200" r="23" fill="#E0AC69"/>
    <path d="M710 310 L710 266 Q710 236 745 236 Q780 236 780 266 L780 310 Z" fill="#F472B6"/>
    <!-- hair -->
    <path d="M497 192 Q498 168 520 168 Q542 168 543 192 Q532 180 520 180 Q508 180 497 192 Z" fill="#1B1B1B"/>
    <path d="M570 172 Q572 148 595 148 Q618 148 620 172 Q608 160 595 160 Q582 160 570 172 Z" fill="#1B1B1B"/>
    <path d="M648 180 Q650 156 672 156 Q694 156 696 180 Q684 168 672 168 Q660 168 648 180 Z" fill="#1B1B1B"/>
    <path d="M723 194 Q725 172 745 172 Q765 172 767 194 Q756 183 745 183 Q734 183 723 194 Z" fill="#1B1B1B"/>
  </g>

  <!-- upcoming events -->
  <text x="40" y="338" font-size="18" font-weight="700" fill="#1B2A5C">Coming up</text>

  <rect x="40" y="352" width="228" height="120" rx="14" fill="#FFFFFF" stroke="#D5DDF3"/>
  <rect x="58" y="370" width="56" height="56" rx="12" fill="#1F3A8A"/>
  <text x="86" y="395" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">Sun</text>
  <text x="86" y="415" font-size="12" fill="#C7D3F3" text-anchor="middle">4pm</text>
  <text x="128" y="392" font-size="15" font-weight="700" fill="#1B2A5C">Weekly meeting</text>
  <text x="128" y="412" font-size="13" fill="#5A6788">Main hall</text>
  <text x="58" y="452" font-size="13" fill="#44506B">All members and guests</text>

  <rect x="286" y="352" width="228" height="120" rx="14" fill="#FFFFFF" stroke="#D5DDF3"/>
  <rect x="304" y="370" width="56" height="56" rx="12" fill="#F97316"/>
  <text x="332" y="395" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">Sat</text>
  <text x="332" y="415" font-size="12" fill="#FFE6D2" text-anchor="middle">10am</text>
  <text x="374" y="392" font-size="15" font-weight="700" fill="#1B2A5C">Outreach day</text>
  <text x="374" y="412" font-size="13" fill="#5A6788">First Saturday</text>
  <text x="304" y="452" font-size="13" fill="#44506B">Serve people around us</text>

  <rect x="532" y="352" width="228" height="120" rx="14" fill="#FFFFFF" stroke="#D5DDF3"/>
  <rect x="550" y="370" width="56" height="56" rx="12" fill="#0F9F74"/>
  <text x="578" y="395" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">Fri</text>
  <text x="578" y="415" font-size="12" fill="#CFF5E7" text-anchor="middle">6pm</text>
  <text x="620" y="392" font-size="15" font-weight="700" fill="#1B2A5C">Games night</text>
  <text x="620" y="412" font-size="13" fill="#5A6788">Last Friday</text>
  <text x="550" y="452" font-size="13" fill="#44506B">Food, music and fun</text>
